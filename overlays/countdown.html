<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&display=swap">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Montserrat", "Raleway", "Noto Sans", sans-serif;
    color: #f4f4f5;
  }
  #time {
    font-size: 112px;
    font-weight: 200;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(225, 29, 72, 0.55), 0 0 4px rgba(225, 29, 72, 0.8);
  }
  #time.done {
    font-size: 72px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { opacity: 0.55; }
  }
</style>
</head>
<body>
<div id="time">10:00</div>
<script>
  // Countdown length in minutes. OBS restarts the page each time the scene goes live.
  const MINUTES = 10;
  const end = Date.now() + MINUTES * 60 * 1000;
  const el = document.getElementById("time");

  function tick() {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
    if (left === 0) {
      el.textContent = "STARTING NOW";
      el.classList.add("done");
      return;
    }
    const m = String(Math.floor(left / 60)).padStart(2, "0");
    const s = String(left % 60).padStart(2, "0");
    el.textContent = `${m}:${s}`;
    setTimeout(tick, 250);
  }
  tick();
</script>
</body>
</html>
